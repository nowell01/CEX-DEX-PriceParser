name: Deploy API to Azure Container Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'CEX-DEX-Parser/**'
      - '!CEX-DEX-Parser/cex-dex-client/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:        # adds a "Run workflow" button for manual deploys

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push image
        run: |
          IMAGE=${{ vars.ACR_NAME }}.azurecr.io/cryptoscan-api:${{ github.sha }}
          docker build -f CEX-DEX-Parser/Dockerfile -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image $IMAGE